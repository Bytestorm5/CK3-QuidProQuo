 qpq_electoral_purchase_name:0 "Electoral Purchase"
 qpq_electoral_purchase_flavor:0 "\"When the electors gather, I want your voice raised for the right candidate. Name your price. I would rather pay it than lose.\""
 qpq_electoral_purchase_rules:0 "Buy an [elector|E]'s vote for your chosen [heir|E]. If it comes out, the vote stands, but the other electors remember it was bought."
 qpq_electoral_purchase_interaction:0 "Propose: Electoral Purchase"
 qpq_electoral_purchase_interaction_desc:0 "#F $qpq_electoral_purchase_flavor$#!\n\n$qpq_electoral_purchase_rules$"
