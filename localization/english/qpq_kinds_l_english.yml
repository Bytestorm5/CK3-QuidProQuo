 qpq_marcher_charge_name:0 "Marcher Charge"
 qpq_marcher_charge_flavor:0 "\"A border is only as strong as the lord who holds it. Keep your levies raised and your watchfires lit, and I will see you paid for every cold night.\""
 qpq_marcher_charge_rules:0 "A [vassal|E] keeps [levies|E] raised and defends a named border for the whole term. Failing is a breach of the deal, not a scandal."
 qpq_marcher_charge_interaction:0 "Propose: Marcher Charge"
 qpq_marcher_charge_interaction_desc:0 "#F $qpq_marcher_charge_flavor$#!\n\n$qpq_marcher_charge_rules$"
