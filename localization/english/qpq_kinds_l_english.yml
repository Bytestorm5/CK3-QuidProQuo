 qpq_marriage_by_command_name:0 "Marriage by Command"
 qpq_marriage_by_command_flavor:0 "\"Marriages are made in the interest of the realm, and unmade in it too. Set aside whoever you must, and wed the one I name.\""
 qpq_marriage_by_command_rules:0 "A [vassal|E] sets aside any [spouse|E] and marries the person you choose."
