 qpq_licensed_feud_name:0 "Licensed Feud"
 qpq_licensed_feud_flavor:0 "\"The law forbids you to war on your neighbour, and keeping the law is my duty. Ride against them all the same. I will find reasons to look the other way.\""
 qpq_licensed_feud_rules:0 "You quietly sanction a [vassal|E]'s war on a fellow vassal despite [crown_authority|E]. They get a Deal War [casus_belli|E] against the target, and a favour [hook|E] on you to get it past the law."
 qpq_licensed_feud_interaction:0 "Propose: Licensed Feud"
 qpq_licensed_feud_interaction_desc:0 "#F $qpq_licensed_feud_flavor$#!\n\n$qpq_licensed_feud_rules$"
