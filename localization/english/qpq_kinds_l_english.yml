 qpq_quiet_removal_name:0 "Quiet Removal"
 qpq_quiet_removal_flavor:0 "\"I want no trial, no war and no witnesses. Only that, before the year is out, a certain name is no longer spoken among the living.\""
 qpq_quiet_removal_rules:0 "Kill a rival [vassal|E], [courtier|E] or foreign figure. If it comes out, both of you carry the murder, and the victim's [house|E] turns hostile."
 qpq_quiet_removal_interaction:0 "Propose: Quiet Removal"
