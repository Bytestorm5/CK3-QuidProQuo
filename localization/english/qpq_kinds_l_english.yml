 qpq_snatch_name:0 "Snatch"
 qpq_snatch_flavor:0 "\"A guest at my court, invited or otherwise, would serve me better than any treaty. Bring me the one I ask for, and bring them unharmed.\""
 qpq_snatch_rules:0 "Kidnap a named character, such as a rival's child, to hold as a [hostage|E] or [ward|E]."
