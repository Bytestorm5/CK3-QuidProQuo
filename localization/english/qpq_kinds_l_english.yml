 qpq_dossier_name:0 "Dossier"
 qpq_dossier_flavor:0 "\"Everyone has something they would rather keep buried. Find what your rival hides, or give the world something to find, and bring it to me.\""
 qpq_dossier_rules:0 "Find or plant [secrets|E] on a rival and hand them over. If it comes out, the target's [opinion|E] of you collapses and the spy is branded an informer."
