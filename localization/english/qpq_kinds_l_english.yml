 qpq_the_cloister_name:0 "The Cloister"
 qpq_the_cloister_flavor:0 "\"There is a peace behind cloister walls that no crown can give. Some would be happier there. I can make it worth their while to find out.\""
 qpq_the_cloister_rules:0 "They, or an awkward relative, take holy vows. If the vassal takes vows themselves, they abdicate to their [heir|E]."
 qpq_the_cloister_interaction:0 "Propose: The Cloister"
