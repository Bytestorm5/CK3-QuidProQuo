 qpq_dispossession_name:0 "Dispossession"
 qpq_dispossession_flavor:0 "\"One of your vassals has become a thorn in my side. Strip them, chain them, do what you must, and let the blame rest with you rather than me.\""
 qpq_dispossession_rules:0 "A [vassal|E] strips or imprisons one of their own vassals whom you want gone, and bears the [tyranny|E] for it."
 qpq_dispossession_interaction:0 "Propose: Dispossession"
