 qpq_loyal_mole_name:0 "The Loyal Mole"
 qpq_loyal_mole_flavor:0 "\"There are lords in my realm who whisper of rising against me. Go among them as one of their own, and when the moment comes, be the one who falters.\""
 qpq_loyal_mole_rules:0 "A [vassal|E] joins a [faction|E] against you, then sabotages it or walks out at the critical moment."
 qpq_loyal_mole_interaction:0 "Propose: The Loyal Mole"
 qpq_loyal_mole_interaction_desc:0 "#F $qpq_loyal_mole_flavor$#!\n\n$qpq_loyal_mole_rules$"
