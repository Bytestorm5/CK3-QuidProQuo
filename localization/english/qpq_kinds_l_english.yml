 qpq_heir_question_name:0 "The Heir Question"
 qpq_heir_question_flavor:0 "\"The succession troubles me. My heir is not the heir I would have chosen. I think you understand me, and I would rather not say more.\""
 qpq_heir_question_rules:0 "Remove your [heir|E] or a disfavoured child. If it comes out: [kinslaying|E], a realm-wide [opinion|E] penalty, and your next heir turns against you."
 qpq_heir_question_interaction:0 "Propose: The Heir Question"
 qpq_heir_question_interaction_desc:0 "#F $qpq_heir_question_flavor$#!\n\n$qpq_heir_question_rules$"
