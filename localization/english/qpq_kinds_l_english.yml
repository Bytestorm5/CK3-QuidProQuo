 qpq_agent_provocateur_name:0 "Agent Provocateur"
 qpq_agent_provocateur_flavor:0 "\"Disloyalty festers best unseen. Raise a banner against me, gather every malcontent beneath it, and let me cut out the rot in a single stroke.\""
 qpq_agent_provocateur_rules:0 "A [vassal|E] starts a revolt on purpose, so you can crush it and [revoke|E] from everyone who joins."
 qpq_agent_provocateur_interaction:0 "Propose: Agent Provocateur"
