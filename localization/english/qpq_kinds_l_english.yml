 qpq_holy_sponsorship_name:0 "Holy Sponsorship"
 qpq_holy_sponsorship_flavor:0 "\"Souls are won with sermons, and sermons are paid for in coin. Bring that county to the true faith, and the labour will not go unrewarded.\""
 qpq_holy_sponsorship_rules:0 "Sponsor a [vassal|E] to bring a named [county|E] into your [faith|E]. Bought piety looks bad if it comes out."
 qpq_holy_sponsorship_interaction:0 "Propose: Holy Sponsorship"
