 qpq_development_charter_name:0 "Development Charter"
 qpq_development_charter_flavor:0 "\"A county is worth what it yields. Build the roads, raise the mills, fill the markets, and I will make it worth your while.\""
 qpq_development_charter_rules:0 "Pay a [vassal|E] to raise one of their [counties|E] by five levels of [county_development|E] within the term."
 qpq_development_charter_interaction:0 "Propose: Development Charter"
 qpq_development_charter_interaction_desc:0 "#F $qpq_development_charter_flavor$#!\n\n$qpq_development_charter_rules$"
