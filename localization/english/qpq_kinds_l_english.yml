l_english:
 qpq_hub.group.war:0 "Commission a war"
 qpq_hub.10.desc:0 "Wars can be bought like anything else: by the season, by the county, or by the corpse.\n\n#weak Hover over an Ask to see its [qpq_scandal_tiers|E] and how it is delivered.#!"
 qpq_hub.group.favours:0 "Ask a favour"
 qpq_hub.11.desc:0 "Not every bargain needs a battlefield. Some need only a quiet word and a full purse.\n\n#weak Hover over an Ask to see its [qpq_scandal_tiers|E] and how it is delivered.#!"
 qpq_hub.group.family:0 "Family and succession"
 qpq_hub.12.desc:0 "Blood binds tighter than any oath, and marriages, vows and votes can all be arranged.\n\n#weak Hover over an Ask to see its [qpq_scandal_tiers|E] and how it is delivered.#!"
 qpq_hub.group.blood:0 "Blood and abduction"
 qpq_hub.13.desc:0 "Some problems are solved by removing them. It is ugly work, and the price reflects it.\n\n#weak Hover over an Ask to see its [qpq_scandal_tiers|E] and how it is delivered.#!"
 qpq_hub.group.shadows:0 "Factions and spies"
 qpq_hub.14.desc:0 "Factions, plots and informers: the realm is a web, and every thread can be pulled.\n\n#weak Hover over an Ask to see its [qpq_scandal_tiers|E] and how it is delivered.#!"
 qpq_hub.group.abroad:0 "Betrayal abroad"
 qpq_hub.15.desc:0 "A foreign court is full of loyalties for sale, if one knows whom to ask.\n\n#weak Hover over an Ask to see its [qpq_scandal_tiers|E] and how it is delivered.#!"
 qpq_hub.group.church_favours:0 "Church favours"
 qpq_hub.16.desc:0 "Grace, they say, is freely given. Everything else the Church dispenses has a price.\n\n#weak Hover over an Ask to see its [qpq_scandal_tiers|E] and how it is delivered.#!"
 qpq_hub.group.church_weapons:0 "The Church as a weapon"
 qpq_hub.17.desc:0 "A curse from the altar cuts deeper than any blade, and can be aimed with the same care.\n\n#weak Hover over an Ask to see its [qpq_scandal_tiers|E] and how it is delivered.#!"
 qpq_chartered_conquest_name:0 "Chartered Conquest"
 qpq_chartered_conquest_flavor:0 "\"There is good land beyond your border, and it does not answer to me. Take it under my charter, and let every court know it was done by my leave.\""
 qpq_chartered_conquest_rules:0 "Publicly charter a [vassal|E] to take land from a named neighbour. They may use the Crown Mandate [casus_belli|E], borrowing your [de_jure|E] right where they have no [claim|E] of their own."
 qpq_chartered_conquest_interaction:0 "Propose: Chartered Conquest"
 qpq_chartered_conquest_interaction_desc:0 "#F $qpq_chartered_conquest_flavor$#!\n\n$qpq_chartered_conquest_rules$"
 qpq_chartered_conquest_prompt:0 "Pick the target"
 recipient_secondary_qpq_chartered_conquest_interaction:0 "Target"
 qpq_chartered_conquest_ask_story:0 "conquer land held by [Story.MakeScope.Var('qpq_target').Char.GetTitledFirstName] under a published charter"
 qpq_chartered_conquest_hub_tt:0 "#T Chartered Conquest#!\n#F $qpq_chartered_conquest_flavor$#!\n\n$qpq_chartered_conquest_rules$\n\n#weak Base [qpq_scandal_tier|E]: 0. Delivered when it happens.#!\n#weak #italic Frontier lordships granted to whoever could take them, as on the Iberian frontier.#!#!"
 qpq_chartered_conquest_ask_event:0 "conquer land held by [secondary_recipient.GetTitledFirstName] under a published charter"
 qpq_chartered_conquest_proposal_desc:0 "#F $qpq_chartered_conquest_flavor$#!\n\nPlainly put, [actor.GetSheHe] would have me $qpq_chartered_conquest_ask_event$."
 qpq_sanctioned_conquest_name:0 "Sanctioned Conquest"
 qpq_sanctioned_conquest_flavor:0 "\"I cannot be seen to set one lord against another. But if you were to ride out on your own account, you would find my purse open and my eyes turned elsewhere.\""
 qpq_sanctioned_conquest_rules:0 "Privately back a [vassal|E]'s conquest of a named target. They fight with their own [casus_belli|E], a [claim|E] you fabricate as part of the payment, or the Deal War you license."
 qpq_sanctioned_conquest_interaction:0 "Propose: Sanctioned Conquest"
 qpq_sanctioned_conquest_interaction_desc:0 "#F $qpq_sanctioned_conquest_flavor$#!\n\n$qpq_sanctioned_conquest_rules$"
 qpq_sanctioned_conquest_prompt:0 "Pick the target"
 recipient_secondary_qpq_sanctioned_conquest_interaction:0 "Target"
 qpq_sanctioned_conquest_ask_story:0 "privately take land from [Story.MakeScope.Var('qpq_target').Char.GetTitledFirstName]"
 qpq_sanctioned_conquest_hub_tt:0 "#T Sanctioned Conquest#!\n#F $qpq_sanctioned_conquest_flavor$#!\n\n$qpq_sanctioned_conquest_rules$\n\n#weak Base [qpq_scandal_tier|E]: I. Delivered when it happens.#!"
