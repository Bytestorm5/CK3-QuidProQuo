 QPQ_UI_SCANDAL_TEXT:0 "Each side's [qpq_scandal_tier|E] is the worse of what it does and what it gives. If a secret deal comes out, whoever paid bears 60% of the fallout and whoever did the deed 40%, plus the full weight of any [crime|E]. Break your side and the other falls away."
 QPQ_UI_CONSEQ_0:0 "Nothing: an honourable deal."
 QPQ_UI_CONSEQ_1:0 "Dealt in the Dark: six years of lowered opinion at court, stress for the honest, just and zealous, and about 50 prestige."
 QPQ_UI_CONSEQ_2:0 "Tier I, and: a Schemer's name, about 150 prestige, 8 legitimacy (or 50 influence)."
 QPQ_UI_CONSEQ_3:0 "Tier II, and: the victim, their allies and house turn on you (-30), about 300 prestige, 15 legitimacy, faction unrest."
 QPQ_UI_CONSEQ_4:0 "Tier III, and: a crime. Imprisonment or stripping of titles; about 500 prestige and 150 piety, 15% risk of excommunication."
 QPQ_UI_CONSEQ_5:0 "Tier IV, and: about 800 prestige and 300 piety, excommunication risk doubled, dynasty renown lost; killing kin makes you a kinslayer."
 QPQ_UI_CONSEQ_PUBLIC_MY:0 "Made public: the fallout of your Tier [GetPlayer.MakeScope.Var('qpq_ui_my_tier').GetValue|0] half lands now, at half weight, and then it is behind you."
