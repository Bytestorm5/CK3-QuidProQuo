 qpq_unknown_pact:0 "Deal"
 qpq_msg_pact_sealed_title:0 "Deal Sealed"
 qpq_msg_pact_sealed_payer_desc:0 "[qpq_agent.GetShortUIName|U] has agreed to your deal: #bold [qpq_story.Custom('QpqKindName')]#!. You hold their half of the secret; they hold yours."
 qpq_msg_pact_sealed_agent_desc:0 "You have agreed to [qpq_payer.GetShortUINamePossessive] deal. The deal is tracked in your Situations window. If it is done by a single act, use #bold Honour the Deal#! on them."
 qpq_msg_pact_delivered_title:0 "Deal Delivered"
 qpq_msg_pact_delivered_payer_desc:0 "[qpq_agent.GetShortUIName|U] has done what you asked. Payment due on delivery is released. The secret remains, and slowly goes stale."
 qpq_msg_pact_delivered_agent_desc:0 "You have done what [qpq_payer.GetShortUIName] asked, and payment due on delivery is released."
 qpq_msg_pact_reneged_title:0 "Payment Withheld"
 qpq_msg_pact_reneged_desc:0 "[qpq_payer.GetShortUIName|U] has refused to pay what was owed. You are the wronged party: you hold a strong hook on them, and exposing the deal would cost you only a quarter of your share."
 qpq_msg_pact_breached_title:0 "Deal Breached"
 qpq_msg_pact_breached_breacher_desc:0 "You broke your deal with [qpq_payer.GetShortUIName]. The wronged party now holds a strong hook on you and can expose the deal cheaply."
 qpq_msg_pact_breached_wronged_desc:0 "The deal has been broken. You are the wronged party: you gain a strong hook on the breacher, and exposing it costs you only a quarter of your share."
 qpq_msg_pact_void_title:0 "Deal Void"
 qpq_msg_pact_void_desc:0 "A deal between [qpq_payer.GetShortUIName] and [qpq_agent.GetShortUIName] can no longer be carried out. Nobody is at fault; any secret it created remains."
 qpq_msg_inherited_stain_title:0 "An Inherited Stain"
 qpq_msg_inherited_stain_desc:0 "Your predecessor's damnable deal has passed to you as a dynasty stain, one tier lower."
 qpq_msg_title_swap_consent_title:0 "Title Swap"
 qpq_msg_title_swap_consent_desc:0 "[qpq_payer.GetShortUIName|U] and [qpq_agent.GetShortUIName] have told you of a county swap between them."
 qpq_msg_proposal_declined_title:0 "Deal Declined"
 qpq_msg_proposal_declined_tt:0 "They will not take the deal on these terms."
 qpq_msg_cannot_honour_title:0 "Cannot Honour Yet"
 qpq_msg_cannot_honour_tt:0 "The deal cannot be carried out right now."
 qpq_hub.1.t:0 "Quid Pro Quo"
 qpq_hub.1.desc:0 "What kind of deal will you put to [recipient.GetShortUIName]? Every deal is an Ask, an Offer, a deadline and a Scandal tier. Only walking away leaves nothing behind."
 qpq_hub.10.desc:0 "Choose the Ask. Hover an option to see its base Scandal tier; context then moves it up or down."
 qpq_hub.11.desc:0 "Choose the Ask. Hover an option to see its base Scandal tier; context then moves it up or down."
 qpq_hub.12.desc:0 "Choose the Ask. Hover an option to see its base Scandal tier; context then moves it up or down."
 qpq_hub.13.desc:0 "Choose the Ask. Hover an option to see its base Scandal tier; context then moves it up or down."
 qpq_hub.14.desc:0 "Choose the Ask. Hover an option to see its base Scandal tier; context then moves it up or down."
 qpq_hub.15.desc:0 "Choose the Ask. Hover an option to see its base Scandal tier; context then moves it up or down."
 qpq_hub.16.desc:0 "Choose the Ask. Hover an option to see its base Scandal tier; context then moves it up or down."
 qpq_hub.17.desc:0 "Choose the Ask. Hover an option to see its base Scandal tier; context then moves it up or down."
 qpq_hub.back:0 "Something else"
 qpq_hub.cancel:0 "Never mind"
 qpq_pact.20.t:0 "Payment Due"
 qpq_pact.20.desc:0 "[qpq_agent.GetShortUIName|U] has delivered on our deal. [qpq_due|0] gold is due."
 qpq_pact.20.a:0 "Pay what I owe"
 qpq_pact.20.b:0 "Renege"
 qpq_pact.20.b.tt:0 "[qpq_agent.GetShortUIName|U] becomes the wronged party, gains a strong hook on you, and can expose the deal cheaply."
 qpq_pact.70.t:0 "The Price of Loyalty"
 qpq_pact.70.desc:0 "Before [qpq_greedy_vassal.GetShortUIName] marches, [qpq_greedy_vassal.GetSheHe] wants [qpq_price|0] gold. Refusing is a public slight, and [qpq_greedy_vassal.GetHerHis] levies will stay home."
 qpq_pact.70.a:0 "Pay them"
 qpq_pact.70.b:0 "I will not be held to ransom"
 qpq_pact.80.t:0 "A Charter Against Us"
 qpq_pact.80.desc:0 "[qpq_payer.GetTitledFirstName] has publicly chartered [qpq_agent.GetShortUIName] to take land that is ours, or our vassal's. Everyone knows it; we had better be ready."
 qpq_pact.80.a:0 "We will be ready"
 qpq_pact.90.t:0 "The Secret Alliance"
 qpq_pact.90.desc:0 "[defender.GetShortUIName|U] has been attacked by [attacker.GetShortUIName]. Our secret alliance obliges me to come to [defender.GetHerHis] aid."
 qpq_pact.90.a:0 "Honour the alliance"
 qpq_pact.90.b:0 "Stay out of it"
 qpq_pact.90.b.tt:0 "This breaches the deal: [defender.GetShortUIName] becomes the wronged party."
 qpq_expose.1.t:0 "Our Deal Is Out"
 qpq_expose.1.desc:0 "The deal between [qpq_payer.GetShortUIName] and [qpq_agent.GetShortUIName] is common knowledge now: both halves are out."
 qpq_expose.1.you_exposed:0 " I burned it myself, and paid only my share of the guilt."
 qpq_expose.1.partner_exposed:0 " [qpq_exposer.GetShortUIName|U] burned it, and burned [qpq_exposer.GetHerselfHimself] with it."
 qpq_expose.1.third_party:0 " [qpq_exposer.GetShortUIName|U] dug it up. It cost [qpq_exposer.GetHerHim] nothing; we both pay in full."
 qpq_expose.1.a:0 "So be it"
 qpq_expose.2.t:0 "A Deal Laid Bare"
 qpq_expose.2.desc:0 "I have exposed the deal between [qpq_payer.GetShortUIName] and [qpq_agent.GetShortUIName]. It cost me nothing."
 qpq_expose.2.a:0 "Let them squirm"
 qpq_expose.3.t:0 "Bought and Sold"
 qpq_expose.3.desc:0 "[qpq_payer.GetShortUIName|U] paid [qpq_agent.GetShortUIName] to act against me. Now I know."
 qpq_expose.3.a:0 "I will remember this"
 qpq_expose.20.t:0 "A Demand for Silence"
 qpq_expose.20.desc:0 "[qpq_ai_blackmailer.GetShortUIName|U] knows about my deal, and wants [qpq_hush_price|0] gold to keep it that way."
 qpq_expose.20.a:0 "Pay the hush money"
 qpq_expose.20.b:0 "Let them talk"
 qpq_expose.20.b.tt:0 "They expose the deal."
 qpq_expose.21.t:0 "They Called My Bluff"
 qpq_expose.21.desc:0 "[recipient.GetShortUIName|U] will not pay. Do I burn the deal, or back down?"
 qpq_expose.21.a:0 "Expose it"
 qpq_expose.21.b:0 "Back down"
 qpq_pact_ledger_decision:0 "Open the Deal Ledger"
 qpq_pact_ledger_decision_desc:0 "Review the deal halves you hold and the deal secrets you know about. Active deals are also listed in your Situations window."
 qpq_pact_ledger_decision_tooltip:0 "Review your deals."
 qpq_pact_ledger_decision_confirm:0 "Open"
 qpq_ledger.1.t:0 "The Deal Ledger"
 qpq_ledger.1.desc:0 "Active deals are tracked in the Situations window. Here are the secrets that outlive them."
 qpq_ledger.1.mine:0 "My deals: the halves I hold"
 qpq_ledger.1.known:0 "Known deals: dirt I hold on others"
 qpq_ledger.close:0 "Close the ledger"
 qpq_ledger.2.t.mine:0 "My Deals"
 qpq_ledger.2.t.known:0 "Known Deals"
