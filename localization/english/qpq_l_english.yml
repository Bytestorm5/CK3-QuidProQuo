 QPQ_UI_SCANDAL_TEXT:0 "Each side's tier is the worse of what it does and what it gives. If a secret deal comes out, whoever paid bears 60% of the fallout and whoever did the deed 40%, plus the full weight of any crime. Break your side and the other falls away."
 QPQ_UI_CONSEQ_0:0 "Nothing: an honourable deal."
 QPQ_UI_CONSEQ_1:0 "Dealt in the Dark: six years of lowered opinion at court, stress for the honest, just and zealous, and about 50 prestige."
 QPQ_UI_CONSEQ_2:0 "Tier I, and: a Schemer's name, about 150 prestige, 8 legitimacy (or 50 influence)."
 QPQ_UI_CONSEQ_3:0 "Tier II, and: the victim, their allies and house turn on you (-30), about 300 prestige, 15 legitimacy, faction unrest."
 QPQ_UI_CONSEQ_4:0 "Tier III, and: a crime. Imprisonment or stripping of titles; about 500 prestige and 150 piety, 15% risk of excommunication."
 QPQ_UI_CONSEQ_5:0 "Tier IV, and: about 800 prestige and 300 piety, excommunication risk doubled, dynasty renown lost; killing kin makes you a kinslayer."
 QPQ_UI_CONSEQ_PUBLIC_MY:0 "Made public: the fallout of your Tier [GetPlayer.MakeScope.Var('qpq_ui_my_tier').GetValue|0] half lands now, at half weight, and then it is behind you."
 QPQ_UI_CONSEQ_PUBLIC_THEIR:0 "Made public: the fallout of their Tier [GetPlayer.MakeScope.Var('qpq_ui_their_tier').GetValue|0] half lands now, at half weight, and then it is behind them."
 QPQ_UI_SECRECY_HEADER:0 "How secret is it?"
 QPQ_UI_SECRECY_SECRET_LABEL:0 "Secret: kept between us"
 QPQ_UI_SECRECY_SECRET_TT:0 "Each of you holds a secret about the other and the deal is enforced with it: break your side and the other may expose you. It costs nothing while hidden, and anyone will sign. If it ever comes out the whole fallout lands, and every secret is blackmail material for whoever learns it."
 QPQ_UI_SECRECY_PUBLIC_LABEL:0 "Public: published as a Charter"
 QPQ_UI_SECRECY_PUBLIC_TT:0 "Published as a Charter: nothing is hidden, so nothing can be exposed, blackmailed over or inherited as a stain, and an honourable deal earns you both prestige. A scandalous one pays at once: half the fallout lands when it is sealed, the target's liege and allies are told, and whoever would rather not be seen doing it asks more."
 QPQ_UI_SECRECY_SECRET:0 "#bold Secret.#! Never below Tier I. Free while hidden; the full fallout if it comes out."
 QPQ_UI_SECRECY_PUBLIC:0 "#bold Public.#! A Charter: nothing to expose. A scandalous deal pays half its fallout now, and they ask more for it."
