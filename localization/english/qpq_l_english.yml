 QPQ_CROWN_MANDATE_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Mandate for [TITLE.GetBaseName]"
 QPQ_CROWN_MANDATE_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Mandate"
 qpq_crown_mandate_cb_victory_desc:0 "[attacker.GetShortUIName|U] takes the chartered land in [defender.GetShortUIName]'s realm."
 qpq_crown_mandate_cb_white_peace_desc:0 "The charter goes unfulfilled for now."
 qpq_crown_mandate_cb_defeat_desc:0 "[attacker.GetShortUIName|U] pays reparations and loses prestige."
 qpq_crown_mandate_cb_invalidated_desc:0 "The chartered land is no longer held by the enemy."
 QPQ_AVENGE_PERFIDY_CB_NAME:0 "Avenge Perfidy"
 QPQ_AVENGE_PERFIDY_WAR_NAME:0 "[ATTACKER.GetShortUIName]'s Vengeance on [DEFENDER.GetShortUIName]"
 QPQ_AVENGE_PERFIDY_WAR_NAME_BASE:0 "War of Vengeance"
 qpq_avenge_perfidy_cb_victory_desc:0 "[defender.GetShortUIName|U] pays reparations and is humiliated; the perfidy is avenged."
 qpq_avenge_perfidy_cb_white_peace_desc:0 "Nobody is satisfied."
 qpq_avenge_perfidy_cb_defeat_desc:0 "[attacker.GetShortUIName|U] pays reparations."
 qpq_avenge_perfidy_cb_invalidated_desc:0 "There is nobody left to punish."
