 qpq_tier_0:0 "Tier 0 (Honourable)"
 qpq_tier_1:0 "Tier I (Discreet)"
 qpq_tier_2:0 "Tier II (Unseemly)"
 qpq_tier_3:0 "Tier III (Scandalous)"
 qpq_tier_4:0 "Tier IV (Disgraceful)"
 qpq_tier_5:0 "Tier V (Damnable)"
 qpq_unknown_pact:0 "Deal"
 qpq_msg_pact_sealed_title:0 "Deal Sealed"
 qpq_msg_pact_sealed_payer_desc:0 "[qpq_agent.GetShortUIName|U] has agreed to your [qpq_deal|E]: #bold [qpq_story.Custom('QpqKindName')]#!. You each hold the other's half of the [secret|E]."
 qpq_msg_pact_sealed_agent_desc:0 "You have agreed to [qpq_payer.GetShortUINamePossessive] [qpq_deal|E]. It is tracked in your Situations window; if it is done by a single act, use #bold Honour the Deal#! on [qpq_payer.GetHerHim]."
 qpq_msg_pact_delivered_title:0 "Deal Delivered"
 qpq_msg_pact_delivered_payer_desc:0 "[qpq_agent.GetShortUIName|U] has done what you asked, and any payment due on delivery has been made. The [secret|E] remains, though it grows stale with time."
 qpq_msg_pact_delivered_agent_desc:0 "You have done what [qpq_payer.GetShortUIName] asked, and any payment due on delivery is yours."
 qpq_msg_pact_reneged_title:0 "Payment Withheld"
 qpq_msg_pact_reneged_desc:0 "[qpq_payer.GetShortUIName|U] refuses to pay what is owed. You are the [qpq_wronged_party|E]: you hold a [strong_hook|E] on [qpq_payer.GetHerHim], and exposing the deal would cost you only a quarter of your share."
 qpq_msg_pact_breached_title:0 "Deal Breached"
 qpq_msg_pact_breached_breacher_desc:0 "You broke your deal with [qpq_payer.GetShortUIName]. The [qpq_wronged_party|E] now holds a [strong_hook|E] on you, and can expose the deal cheaply."
 qpq_msg_pact_breached_wronged_desc:0 "The deal has been broken. You are the [qpq_wronged_party|E]: you gain a [strong_hook|E] on the one who broke it, and exposing it would cost you only a quarter of your share."
 qpq_msg_pact_void_title:0 "Deal Void"
 qpq_msg_pact_void_desc:0 "A deal between [qpq_payer.GetShortUIName] and [qpq_agent.GetShortUIName] can no longer be carried out. No one is at fault, but any [secret|E] it left behind remains."
 qpq_msg_inherited_stain_title:0 "An Inherited Stain"
 qpq_msg_inherited_stain_desc:0 "Your predecessor's damnable deal has passed to you with the inheritance, one tier lower."
 qpq_msg_title_swap_consent_title:0 "County Transfer"
 qpq_msg_title_swap_consent_desc:0 "[qpq_payer.GetShortUIName|U] and [qpq_agent.GetShortUIName] have told you of a [county|E] changing hands between them."
 qpq_msg_proposal_declined_title:0 "Deal Declined"
 qpq_msg_proposal_declined_tt:0 "They will not take the deal on these terms."
 qpq_msg_cannot_honour_title:0 "Cannot Honour Yet"
 qpq_msg_cannot_honour_tt:0 "The deal cannot be carried out right now."
 qpq_hub.1.t:0 "Quid Pro Quo"
 qpq_hub.1.desc:0 "[recipient.GetTitledFirstName] is someone I could do business with. Everyone has a price, and most have a use. The only questions are what I want done, and what it is worth to me.\n\n#weak Every [qpq_deal|E] is an Ask, an offer, a deadline and a [qpq_scandal_tier|E] for each side. Only walking away leaves nothing behind.#!"
 qpq_hub.back:0 "Something else, then."
 qpq_hub.cancel:0 "Perhaps another time."
 qpq_pact.20.t:0 "A Debt Come Due"
 qpq_pact.20.desc:0 "[qpq_agent.GetTitledFirstName] has done what I asked, and done it well. Now [qpq_agent.GetSheHe] waits on the rest of the bargain: [qpq_due|0] [gold|E], as we agreed."
 qpq_pact.20.a:0 "A bargain is a bargain."
 qpq_pact.20.b:0 "And if I simply... do not pay?"
 qpq_pact.20.b.tt:0 "[qpq_agent.GetShortUIName|U] becomes the [qpq_wronged_party|E], gains a [strong_hook|E] on you, and can expose the deal cheaply."
 qpq_pact.70.t:0 "The Price of Loyalty"
 qpq_pact.70.desc:0 "My banners are called, but [qpq_greedy_vassal.GetTitledFirstName] has not ridden out. Instead there is a messenger: [qpq_greedy_vassal.GetSheHe] will march, but only once [qpq_price|0] [gold|E] has changed hands.\n\nIf I refuse, every lord in the realm will hear of it, and [qpq_greedy_vassal.GetFirstNamePossessive] levies will stay at home."
 qpq_pact.70.a:0 "\"Pay [qpq_greedy_vassal.GetHerHim]. We need those swords.\""
 qpq_pact.70.b:0 "\"I will not be held to ransom by my own vassal!\""
 qpq_pact.80.t:0 "A Charter Against Us"
 qpq_pact.80.desc:0 "Heralds have read it out in every market square: [qpq_payer.GetTitledFirstName] has granted [qpq_agent.GetTitledFirstName] leave to take what is ours. It is not a rumour or an idle threat. It is a charter, sealed and proclaimed."
 qpq_pact.80.a:0 "Then let them come and try."
 qpq_pact.90.t:0 "An Oath in the Dark"
 qpq_pact.90.desc:0 "[attacker.GetTitledFirstName] has marched on [defender.GetTitledFirstName]. No herald ever proclaimed our alliance, and no clerk wrote it down, but I swore it all the same, and [defender.GetFirstName] will be counting the days until my banners appear."
 qpq_pact.90.a:0 "I keep my oaths, even the secret ones."
 qpq_pact.90.b:0 "No one will ever know I promised anything."
 qpq_pact.90.b.tt:0 "This breaches the deal: [defender.GetShortUIName] becomes the [qpq_wronged_party|E]."
 qpq_expose.1.t:0 "Laid Bare"
 qpq_expose.1.desc:0 "It was always going to come out. Now the whole court knows what passed between [qpq_payer.GetTitledFirstName] and [qpq_agent.GetTitledFirstName], and they are no longer whispering about it."
 qpq_expose.1.you_exposed:0 " I lit the fire myself, at least, and chose how much of me it burned."
 qpq_expose.1.partner_exposed:0 " It was [qpq_exposer.GetFirstName] who told them, and [qpq_exposer.GetSheHe] has not spared [qpq_exposer.GetHerselfHimself] in the telling."
 qpq_expose.1.third_party:0 " [qpq_exposer.GetTitledFirstName] dug it up. It cost [qpq_exposer.GetHerHim] nothing, and it will cost us dearly."
 qpq_expose.1.a:0 "What is done is done."
 qpq_expose.2.t:0 "Dragged Into the Light"
 qpq_expose.2.desc:0 "I have dragged it into the open: the bargain between [qpq_payer.GetTitledFirstName] and [qpq_agent.GetTitledFirstName], with every ugly detail. My own hands are clean."
 qpq_expose.2.a:0 "Let them squirm."
 qpq_expose.3.t:0 "Bought and Sold"
 qpq_expose.3.desc:0 "So that is how it was. [qpq_payer.GetTitledFirstName] paid [qpq_agent.GetTitledFirstName] to work against me, and I never saw the coin change hands."
 qpq_expose.3.a:0 "I will not forget this."
 qpq_expose.20.t:0 "The Price of Silence"
 qpq_expose.20.desc:0 "A note, unsigned, though I know the hand. [qpq_ai_blackmailer.GetTitledFirstName] knows about my deal, and for [qpq_hush_price|0] [gold|E] it will stay known only to [qpq_ai_blackmailer.GetHerHim]."
 qpq_expose.20.a:0 "\"Take it, and never speak of this again.\""
 qpq_expose.20.b:0 "\"Talk, then, and be damned.\""
 qpq_expose.20.b.tt:0 "They expose the deal."
 qpq_expose.21.t:0 "They Called My Bluff"
 qpq_expose.21.desc:0 "[recipient.GetTitledFirstName] has laughed at my demand, or near enough. Either I make good on my threat and burn what I know, or I let it go, and let [recipient.GetHerHim] think me toothless."
 qpq_expose.21.a:0 "Then the world shall know."
 qpq_expose.21.b:0 "Another day, perhaps."
 qpq_pact_ledger_decision:0 "Open the Deal Ledger"
 qpq_pact_ledger_decision_desc:0 "#F Every bargain leaves a trace: a letter, a debt, a name I would rather forget. I keep them all in one place, where only I can find them.#!"
 qpq_pact_ledger_decision_tooltip:0 "Review the deal [secrets|E] you hold, and those you know about"
 qpq_pact_ledger_decision_confirm:0 "Open the ledger"
 qpq_ledger.1.t:0 "The Deal Ledger"
 qpq_ledger.1.desc:0 "The ledger is bound in plain leather, with nothing written on its spine. Inside are the bargains that outlived their usefulness, and the ones I learned of by other means.\n\n#weak Running deals are tracked in the Situations window.#!"
 qpq_ledger.1.mine:0 "The halves I hold"
 qpq_ledger.1.known:0 "What I know of others"
 qpq_ledger.close:0 "Close the ledger."
 qpq_ledger.2.t.mine:0 "My Deals"
 qpq_ledger.2.t.known:0 "Known Deals"
 qpq_ledger.2.intro:0 ""
 qpq_ledger.2.slot1:0 "\n#bold [qpq_l1.Custom('QpqKindName')]#!: [qpq_l1.GetOwner.GetShortUIName] and [qpq_l1.GetTargetCharacter.GetShortUIName], [qpq_l1.Custom('QpqTierName')]"
 qpq_ledger.2.slot2:0 "\n#bold [qpq_l2.Custom('QpqKindName')]#!: [qpq_l2.GetOwner.GetShortUIName] and [qpq_l2.GetTargetCharacter.GetShortUIName], [qpq_l2.Custom('QpqTierName')]"
 qpq_ledger.2.slot3:0 "\n#bold [qpq_l3.Custom('QpqKindName')]#!: [qpq_l3.GetOwner.GetShortUIName] and [qpq_l3.GetTargetCharacter.GetShortUIName], [qpq_l3.Custom('QpqTierName')]"
 qpq_ledger.2.slot4:0 "\n#bold [qpq_l4.Custom('QpqKindName')]#!: [qpq_l4.GetOwner.GetShortUIName] and [qpq_l4.GetTargetCharacter.GetShortUIName], [qpq_l4.Custom('QpqTierName')]"
 qpq_ledger.2.slot5:0 "\n#bold [qpq_l5.Custom('QpqKindName')]#!: [qpq_l5.GetOwner.GetShortUIName] and [qpq_l5.GetTargetCharacter.GetShortUIName], [qpq_l5.Custom('QpqTierName')]"
 qpq_ledger.2.next:0 "Turn the page."
 qpq_ledger.2.back:0 "Back to the beginning."
 QPQ_STORY_AGENT_LABEL:0 "Agent"
