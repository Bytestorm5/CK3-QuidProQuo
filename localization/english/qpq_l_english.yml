l_english:
 qpq_send_pact:0 "Propose the Deal"
 qpq_truce_name:0 "A truce bought in a backroom deal"
 qpq_propose_pact_interaction:0 "Strike a Backroom Deal"
 qpq_propose_pact_interaction_desc:0 "Offer [recipient.GetShortUIName] a deal: an Ask they carry out, and what you give in return. From Tier I up, sealing it creates a secret you both hold, and that shared secret is what keeps both of you honest."
 qpq_honour_pact_interaction:0 "Honour the Deal"
 qpq_honour_pact_interaction_desc:0 "Carry out what you promised [recipient.GetShortUIName] and collect what is owed to you."
 qpq_break_pact_interaction:0 "Break the Deal"
 qpq_break_pact_interaction_desc:0 "Openly walk away from a deal with [recipient.GetShortUIName]. They become the wronged party: they gain a strong hook on you and can expose the deal for a quarter of their usual cost."
 qpq_proclaim_charter_interaction:0 "Proclaim as a Charter"
 qpq_proclaim_charter_interaction_desc:0 "Publish your private deal with [recipient.GetShortUIName] as a Charter. The secret disappears, you both gain prestige, and the target's liege and allies are alerted. A war's casus belli cannot change once it is declared, so this is only possible before the war begins."
 qpq_proclaim_before_war:0 "The war has already been declared"
 qpq_renegotiate_interaction:0 "Renegotiate (Blackmail)"
 qpq_renegotiate_interaction_desc:0 "You know about [recipient.GetShortUINamePossessive] deal. Demand more for your silence, or else. Paying hush money is itself a Tier II deal, and if the original ever comes out, the cover-up makes it worse."
 qpq_reneg_gold:0 "Demand hush money"
 qpq_reneg_gold_desc:0 "They pay you now, and a Hush Money deal binds you to silence."
 qpq_reneg_hook:0 "Demand a favour"
 qpq_reneg_hook_desc:0 "They give you a strong hook on themselves instead of gold."
 qpq_confess_pact_interaction:0 "Confess our Deal"
 qpq_confess_pact_interaction_desc:0 "Confess your deal with [recipient.GetShortUIName]. You still pay 75% of your own share, forfeit any payment, and owe a penance; [recipient.GetShortUIName] pays in full. Penance follows your faith: a church takes it in gold, other faiths expect alms, contrition or a pilgrimage. A deathbed confession costs the dying little, but Tier IV and V fallout passes to the heir."
 qpq_penance_gold:0 "Pay a penance to the Church"
 qpq_penance_gold_desc:0 "Pay a penance in gold to the head of your faith, who can absolve you."
 qpq_penance_piety:0 "Penance in piety"
 qpq_penance_piety_desc:0 "Lose piety in public contrition."
 qpq_penance_pilgrimage:0 "Owe a pilgrimage"
 qpq_penance_pilgrimage_desc:0 "Swear to go on pilgrimage (for Muslims, the Hajj) within five years. Until you have, the clergy think less of you."
 qpq_offer_gold:0 "Gold"
 qpq_offer_gold_desc:0 "Pay the fair price in gold. Paid up front unless you choose another timing below. Up-front gold is simply lost if they breach."
 qpq_offer_on_delivery:0 "Pay on delivery"
 qpq_offer_on_delivery_desc:0 "The gold is paid only once the Ask is done. They like this less, and you may still renege."
 qpq_offer_split:0 "Half now, half on delivery"
 qpq_offer_split_desc:0 "The usual medieval arrangement."
 qpq_offer_stipend:0 "Yearly installments"
 qpq_offer_stipend_desc:0 "Spread the gold across the term. Missing an installment is a breach on your side."
 qpq_offer_land:0 "Land"
 qpq_offer_land_desc:0 "Hand over one of your counties (your least developed, never your capital) on delivery."
 qpq_offer_claim:0 "A claim"
 qpq_offer_claim_desc:0 "Your chancellor fabricates a claim for them on the target's land: pay with future wars."
 qpq_offer_office:0 "Office"
 qpq_offer_office_desc:0 "Give them a seat on your council now. Dismissing them before the deadline is a breach."
 qpq_offer_release_hook:0 "Release a hook"
 qpq_offer_release_hook_desc:0 "Release the hook you hold on them."
 qpq_offer_my_word:0 "My word as bond"
 qpq_offer_my_word_desc:0 "Give them a weak hook on yourself: an IOU."
 qpq_offer_secret:0 "A secret on someone"
 qpq_offer_secret_desc:0 "Hand over what you know about someone, chosen by name. Its worth is what it can do to them, to the one who gets it: a crime is worth far more than a shame, and a rival's far more than a stranger's."
 qpq_offer_contract:0 "Contract terms"
 qpq_offer_contract_desc:0 "Better terms for their contract on delivery: permanent, so worth a lot to them."
 qpq_offer_succession:0 "Succession"
 qpq_offer_succession_desc:0 "Name them your designated heir on delivery."
 qpq_offer_clemency:0 "Clemency"
 qpq_offer_clemency_desc:0 "Release them or their kin from your dungeon, and drop any charge you hold against them."
 qpq_offer_arms:0 "Arms"
 qpq_offer_arms_desc:0 "Lend them levies and knights until the deadline."
 qpq_offer_artifact:0 "Artifacts"
 qpq_offer_artifact_desc:0 "Hand over artifacts, chosen by name. Each is worth its rarity and wear, and more to someone who needs what it gives: prestige, piety, gold, strength in war, schemes, standing."
 qpq_offer_church:0 "Church favour"
 qpq_offer_church_desc:0 "An indulgence and absolution from the head of faith."
 qpq_offer_restraint:0 "Restraint"
 qpq_offer_restraint_desc:0 "Promise not to revoke their titles or imprison them for the whole term. Doing so anyway is a breach."
 qpq_offer_hook:0 "Call in a hook"
 qpq_offer_hook_desc:0 "Use the hook you hold on them to press the deal."
 qpq_offer_charter:0 "Publish as a Charter"
 qpq_offer_charter_desc:0 "Floor 0 only. Prestige for both and, for conquests, the Crown Mandate casus belli. The target's liege and allies are alerted and weight defending their vassal more heavily."
 qpq_demand_gold:0 "Demand gold"
 qpq_demand_gold_desc:0 "They pay you the fair price in gold, up front unless a timing is chosen."
 qpq_demand_on_delivery:0 "Accept payment on delivery"
 qpq_demand_on_delivery_desc:0 "You are paid once you have done your part."
 qpq_demand_split:0 "Half now, half on delivery"
 qpq_demand_split_desc:0 "The usual medieval arrangement."
 qpq_demand_stipend:0 "Yearly installments"
 qpq_demand_stipend_desc:0 "Paid across the term."
 qpq_demand_land:0 "Demand land"
 qpq_demand_land_desc:0 "One of their counties, handed over when you deliver."
 qpq_demand_office:0 "Demand office"
 qpq_demand_office_desc:0 "A seat on their council now."
 qpq_demand_contract:0 "Demand contract terms"
 qpq_demand_contract_desc:0 "Better terms for your contract when you deliver."
 qpq_demand_release_hook:0 "Demand they release a hook"
 qpq_demand_release_hook_desc:0 "They release the hook they hold on you."
 qpq_demand_my_word:0 "Demand their word"
 qpq_demand_my_word_desc:0 "A weak hook on them: an IOU."
 qpq_demand_clemency:0 "Demand clemency"
 qpq_demand_clemency_desc:0 "Release from prison, and any charge against you dropped."
 qpq_demand_artifact:0 "Demand artifacts"
 qpq_demand_artifact_desc:0 "Their artifacts, chosen by name, when you deliver. What they cost them is their rarity and wear."
 qpq_demand_church:0 "Demand church favour"
 qpq_demand_church_desc:0 "Indulgence and absolution, if they are a head of faith."
 qpq_offer_need_gold:0 "You need at least half the price in gold to hand"
 qpq_offer_one_timing:0 "Choose at most one payment timing"
 qpq_x_armed:0 "Armed league"
 qpq_x_armed_desc:0 "Swear to take up arms, not just to object. Tier IV towards your liege."
 qpq_x_consent:0 "Seek the liege's consent"
 qpq_x_consent_desc:0 "Tell your liege about the swap. Tier I instead of III, and nothing to void later."
 qpq_x_armies:0 "Secretly promise armies"
 qpq_x_armies_desc:0 "Promise to march for their claim. They value it highly; it is the clause that hurts if it comes out."
 qpq_actor_pact_cap_reached:0 "[actor.GetShortUIName|U] already has as many deals as they can manage (2 + diplomacy / 5)"
 qpq_recipient_pact_cap_reached:0 "[recipient.GetShortUIName|U] already has as many deals as they can manage (2 + diplomacy / 5)"
