 QPQ_UI_SECRECY_HEADER:0 "How secret is it?"
 QPQ_UI_SECRECY_SECRET_LABEL:0 "Secret: kept between us"
 QPQ_UI_SECRECY_SECRET_TT:0 "Each of you holds a secret about the other and the deal is enforced with it: break your side and the other may expose you. It costs nothing while hidden, and anyone will sign. If it ever comes out the whole fallout lands, and every secret is blackmail material for whoever learns it."
 QPQ_UI_SECRECY_PUBLIC_LABEL:0 "Public: published as a Charter"
 QPQ_UI_SECRECY_PUBLIC_TT:0 "Published as a Charter: nothing is hidden, so nothing can be exposed, blackmailed over or inherited as a stain, and an honourable deal earns you both prestige. A scandalous one pays at once: half the fallout lands when it is sealed, the target's liege and allies are told, and whoever would rather not be seen doing it asks more."
