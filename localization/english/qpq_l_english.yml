 qpq_hub.50.t:0 "A Proposal"
 qpq_hub.50.intro:0 "A letter has come from [actor.GetTitledFirstName], sealed in plain wax with no device pressed into it.\n\n"
 qpq_hub.50.terms_offer:0 "\n\nFor this, [actor.GetSheHe] offers:"
 qpq_hub.50.terms_demand:0 "\n\nIn return, [actor.GetSheHe] asks for:"
 qpq_hub.50.term_gold:0 "\n #P •#! [qpq_price|0] gold"
 qpq_hub.50.term_on_delivery:0 "\n #P •#! the gold paid on delivery"
 qpq_hub.50.term_split:0 "\n #P •#! half the gold now, half on delivery"
 qpq_hub.50.term_stipend:0 "\n #P •#! the gold in yearly installments across the term"
 qpq_hub.50.term_land:0 "\n #P •#! land: the chosen titles, handed over on delivery"
 qpq_hub.50.term_claim:0 "\n #P •#! a fabricated claim on the target's land"
 qpq_hub.50.term_office:0 "\n #P •#! a council seat"
 qpq_hub.50.term_release_hook:0 "\n #P •#! the release of a hook"
 qpq_hub.50.term_my_word:0 "\n #P •#! a sworn word: a weak hook"
 qpq_hub.50.term_secret:0 "\n #P •#! a secret about someone they name"
 qpq_hub.50.term_succession:0 "\n #P •#! being named heir on delivery"
 qpq_hub.50.term_clemency:0 "\n #P •#! clemency"
 qpq_hub.50.term_arms:0 "\n #P •#! men lent until the deadline"
 qpq_hub.50.term_artifact:0 "\n #P •#! the artifacts named, on delivery"
 qpq_hub.50.term_church:0 "\n #P •#! church favour: an indulgence and absolution"
 qpq_hub.50.term_restraint:0 "\n #P •#! a promise of restraint for the whole term"
 qpq_hub.50.term_hook:0 "\n #N •#! a hook held on you, called in"
 qpq_hub.50.term_nothing:0 "\n #weak • nothing but [actor.GetHerHis] goodwill#!"
 qpq_hub.50.term_qpq_x_armed:0 "\n #weak Also:#! $qpq_x_armed$ ($qpq_x_armed_desc$)"
 qpq_hub.50.term_qpq_x_consent:0 "\n #weak Also:#! $qpq_x_consent$ ($qpq_x_consent_desc$)"
 qpq_hub.50.term_qpq_x_armies:0 "\n #weak Also:#! $qpq_x_armies$ ($qpq_x_armies_desc$)"
 qpq_hub.50.c:0 "\"Whatever this was, it is too late now.\""
 qpq_hub.50.c_tt:0 "The deal no longer stands: the target, your ties, the gold or the room for another deal has changed since it was offered."
 qpq_hub.50.term_charter:0 "\n #P •#! publication as a Charter: public, honourable, and no secret"
 qpq_hub.50.a:0 "\"You have yourself a bargain.\""
 qpq_hub.50.b:0 "\"I want no part of this.\""
 qpq_pact_story:0 "Deal"
 qpq_pact_story_desc:0 "#F A bargain you are paying for, and a secret you share.#!"
 qpq_pact_mirror_story:0 "Deal"
 qpq_pact_mirror_story_desc:0 "#F A bargain you are being paid for, and a secret you share.#!"
 QPQ_STORY_PAYER_STRING:0 "#bold [Story.Custom('QpqKindName')]#!, [Story.Custom('QpqMyTier')]\n[Story.Custom('QpqStoryFlavor')]\n\n#bold You get:#! [Story.MakeScope.Var('qpq_agent').Char.GetShortUIName] will [Story.Custom('QpqKindAsk')].\n[Story.Custom('QpqAskStatus')]\n\n#bold You still owe:#![Story.Custom('QpqOwesGoldDue')][Story.Custom('QpqOwesStipend')][Story.Custom('QpqOwesLand')][Story.Custom('QpqOwesArtifact')][Story.Custom('QpqOwesContract')][Story.Custom('QpqOwesSuccession')][Story.Custom('QpqOwesOffice')]$qpq_sl_contract_block$[Story.Custom('QpqOwesRestraint')][Story.Custom('QpqOwesNothing')]\n\n#bold Already given:#![Story.Custom('QpqGaveGold')][Story.Custom('QpqGaveClaim')][Story.Custom('QpqGaveHookRelease')][Story.Custom('QpqGaveMyWord')][Story.Custom('QpqGaveSecret')][Story.Custom('QpqGaveClemency')][Story.Custom('QpqGaveArms')][Story.Custom('QpqGaveChurch')][Story.Custom('QpqUsedHook')][Story.Custom('QpqGaveNothing')]\n\n#bold Deadline:#! [Story.MakeScope.Var('qpq_months_left').GetValue|0] of [Story.MakeScope.Var('qpq_term').GetValue|0] months left. [Story.Custom('QpqSecretLine')]"
