 qpq_hub.50.none:0 ""
 qpq_hub.50.price:0 "\n\nUnless it is published as a Charter, sealing it gives each of you half of a secret that could ruin the other."
 qpq_hub.50.terms_offer:0 "\n\nIn return, [actor.GetShortUIName] offers:"
