 # ---------------- Command ----------------
 QPQ_UI_CMD_HEADER:0 "Your authority"
 QPQ_UI_CMD_HEADER_TT:0 "How far you lean on your standing as [qpq_command|E]. Your standing is your [legitimacy_level|E] (your [prestige_level|E] if you have no [legitimacy|E]); what [GetPlayer.MakeScope.Var('qpq_ui_recipient').Char.GetShortUIName] expects of you grows with your rank, and by one level for each step further down your realm they stand.\n\nA command adds to their acceptance but never outweighs a refusal at any price. If the deal comes out you pay what was at stake; proclaimed as a [qpq_charter|E], a scandalous command costs half of it at once. If they would have refused without it, they obey and resent it."
 QPQ_UI_CMD_0_LABEL:0 "Ask"
 QPQ_UI_CMD_1_LABEL:0 "Remind"
 QPQ_UI_CMD_2_LABEL:0 "Command"
 QPQ_UI_CMD_3_LABEL:0 "Decree"
 QPQ_UI_CMD_0_TT:0 "#T Ask as an equal#!\nNo authority is used: nothing added, and nothing at stake."
 QPQ_UI_CMD_1_TT:0 "#T Remind them of their duty#!\nYour standing may fall one level short of what they expect.\n#P +15#! to their acceptance.\nAt stake if it comes out: some [prestige|E] and [legitimacy|E].\nIf they would have refused: #N -15#! [opinion|E] of you."
 QPQ_UI_CMD_2_TT:0 "#T Command it#!\nYour standing must meet what they expect.\n#P +30#! to their acceptance.\nAt stake if it comes out: more [prestige|E] and [legitimacy|E].\nIf they would have refused: #N -30#! [opinion|E] of you."
 QPQ_UI_CMD_3_TT:0 "#T Brook no refusal#!\nYour standing must exceed what they expect by two levels.\n#P +45#! to their acceptance.\nAt stake if it comes out: a great deal of [prestige|E] and [legitimacy|E].\nIf they would have refused: #N -45#! [opinion|E] of you."
 QPQ_UI_CMD_NEEDS_1:0 "Your standing is no more than one level short of what [GetPlayer.MakeScope.Var('qpq_ui_recipient').Char.GetShortUIName] expects of you"
 QPQ_UI_CMD_NEEDS_2:0 "Your standing meets what [GetPlayer.MakeScope.Var('qpq_ui_recipient').Char.GetShortUIName] expects of you"
 QPQ_UI_CMD_NEEDS_3:0 "Your standing exceeds what [GetPlayer.MakeScope.Var('qpq_ui_recipient').Char.GetShortUIName] expects of you by two levels"
 QPQ_UI_CMD_STANDING:0 "Your standing: #V [GetPlayer.MakeScope.Var('qpq_ui_cmd_level').GetValue|0]#!. [GetPlayer.MakeScope.Var('qpq_ui_recipient').Char.GetShortUIName] expects #V [GetPlayer.MakeScope.Var('qpq_ui_cmd_expect').GetValue|0]#! of you."
 QPQ_UI_CMD_NOTE_0:0 "$QPQ_UI_CMD_STANDING$ #weak You ask; you do not command.#!"
 QPQ_UI_CMD_NOTE_1:0 "$QPQ_UI_CMD_STANDING$ #weak You remind them where their duty lies.#!"
 QPQ_UI_CMD_NOTE_2:0 "$QPQ_UI_CMD_STANDING$ #weak You command it.#!"
 QPQ_UI_CMD_NOTE_3:0 "$QPQ_UI_CMD_STANDING$ #weak You will brook no refusal.#!"
 QPQ_UI_ACC_CMD_LINE:0 "\nYour authority: [GetPlayer.MakeScope.Var('qpq_ui_acc_cmd').GetValue|=+0]"
 qpq_deal.1.command_1:0 "\n\n[actor.GetSheHe|U] is careful to remind me where my duty lies."
 qpq_deal.1.command_2:0 "\n\nThis is no request. [actor.GetSheHe|U] commands it."
 qpq_deal.1.command_3:0 "\n\n[actor.GetSheHe|U] will brook no refusal, and a refusal of this kind would not be forgotten."
 qpq_commanded_opinion:0 "Commanded Against My Will"
 qpq_defied_command_opinion:0 "Defied My Command"
 game_concept_qpq_command:0 "Command"
 game_concept_qpq_command_desc:0 "A [liege|E] may lean on their standing when putting a [qpq_deal|E] to someone under them in their realm, however far down. How hard they can lean depends on their [legitimacy_level|E] (their [prestige_level|E] without [legitimacy|E]) against what that subordinate expects of them, which grows with the liege's rank and with each step down the realm.\n\n$QPQ_UI_CMD_0_LABEL$, $QPQ_UI_CMD_1_LABEL$, $QPQ_UI_CMD_2_LABEL$ and $QPQ_UI_CMD_3_LABEL$ add nothing, 15, 30 and 45 to their acceptance, and put more [prestige|E] and [legitimacy|E] at stake if the deal comes out. A command never outweighs a refusal at any price. One who would have refused obeys, and resents it; a person who refuses a command is remembered for it."
