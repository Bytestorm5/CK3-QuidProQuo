l_english:
 qpq_send_pact:0 "Propose the Deal"
 qpq_truce_name:0 "A truce bought in a backroom deal"
 qpq_propose_pact_interaction:0 "Strike a Backroom Deal"
 qpq_propose_pact_interaction_desc:0 "Everyone has a price. Find out what [recipient.GetShortUINameNoTooltip] would do for me, and what it would cost\n\n#weak A [qpq_deal|E] is what each side does or gives for the other, a deadline, and a [qpq_scandal_tier|E] for each side. A secret one leaves each of you holding a [secret|E] over the other.#!"
 qpq_honour_pact_interaction:0 "Honour the Deal"
 qpq_honour_pact_interaction_desc:0 "Do what I promised [recipient.GetShortUINameNoTooltip], and collect what I am owed"
 qpq_break_pact_interaction:0 "Break the Deal"
 qpq_break_pact_interaction_desc:0 "Walk away from my bargain with [recipient.GetShortUINameNoTooltip], openly and without apology\n\n#weak [recipient.GetShortUIName|U] becomes the [qpq_wronged_party|E]: a [strong_hook|E] on you, and the power to expose the deal cheaply.#!"
 qpq_proclaim_charter_interaction:0 "Proclaim as a Charter"
 qpq_proclaim_charter_interaction_desc:0 "Let the realm hear what [recipient.GetShortUINameNoTooltip] and I have agreed, and let no one call it a secret again\n\n#weak The deal becomes a public [qpq_charter|E]: the [secret|E] is gone, you both gain [prestige|E], and the target's [liege|E] and allies are warned. A [casus_belli|E] cannot change once war is declared, so this is only possible before then.#!"
 qpq_proclaim_before_war:0 "The war has already been declared"
 qpq_renegotiate_interaction:0 "Renegotiate (Blackmail)"
 qpq_renegotiate_interaction_desc:0 "I know what [recipient.GetShortUINameNoTooltip] bargained for, and what it cost. My silence has a price as well\n\n#weak Paying hush money is itself a Tier II [qpq_deal|E], and if the original ever comes out, the cover-up makes it worse.#!"
 qpq_reneg_gold:0 "Demand hush money"
 qpq_reneg_gold_desc:0 "They pay [gold|E] now, and a Hush Money [qpq_deal|E] binds you to silence."
 qpq_reneg_hook:0 "Demand a favour"
 qpq_reneg_hook_desc:0 "They give you a [strong_hook|E] on themselves instead of gold."
 qpq_confess_pact_interaction:0 "Confess our Deal"
 qpq_confess_pact_interaction_desc:0 "Unburden my conscience of my deal with [recipient.GetShortUINameNoTooltip], before someone else drags it into the light\n\n#weak You still bear 75% of your own share, forfeit any payment and owe a penance; [recipient.GetShortUIName] bears the full share. A deathbed confession costs the dying little, but Tier IV and V fallout passes to the [heir|E].#!"
 qpq_penance_gold:0 "Do penance before the Church"
 qpq_penance_gold_desc:0 "Pay a penance in [gold|E] to the [head_of_faith|E], who can absolve you."
 qpq_penance_piety:0 "Public contrition"
 qpq_penance_piety_desc:0 "Humble yourself before the court and the clergy, at the cost of [piety|E]."
 qpq_penance_pilgrimage:0 "Swear a pilgrimage"
 qpq_penance_pilgrimage_desc:0 "Swear to make a [pilgrimage|E] (for Muslims, the [hajj|E]) within five years. Until you do, the clergy think less of you."
 qpq_offer_gold:0 "Gold"
 qpq_offer_gold_desc:0 "Pay the fair price in [gold|E], all up front unless you choose another timing. Gold paid up front is simply lost if they breach."
 qpq_offer_on_delivery:0 "Pay on delivery"
 qpq_offer_on_delivery_desc:0 "The gold is paid only once the Ask is done. They like this less, and you may still renege."
 qpq_offer_split:0 "Half now, half on delivery"
 qpq_offer_split_desc:0 "Half the gold now, half when the deed is done: the usual arrangement."
 qpq_offer_stipend:0 "Yearly installments"
 qpq_offer_stipend_desc:0 "Spread the gold across the term. Missing an installment is a breach on your side."
 qpq_offer_land:0 "Land"
 qpq_offer_land_desc:0 "Hand over one of your [counties|E] on delivery: your least developed, never your [capital|E]."
 qpq_offer_claim:0 "A claim"
 qpq_offer_claim_desc:0 "Your chancellor fabricates a [claim|E] for them on the target's land, so they can pay themselves with a war."
 qpq_offer_office:0 "Office"
 qpq_offer_office_desc:0 "A seat on your [council|E] now. Dismissing them before the deadline is a breach."
 qpq_offer_release_hook:0 "Release a hook"
 qpq_offer_release_hook_desc:0 "Release the [hook|E] you hold on them."
 qpq_offer_my_word:0 "Weak Hook"
 qpq_offer_my_word_desc:0 "Give them a [weak_hook|E] on yourself: a debt of honour."
 qpq_offer_secret:0 "A secret on someone"
 qpq_offer_secret_desc:0 "Hand over what you know about someone, chosen by name. Its worth is what it can do to them, to the one who gets it: a [crime|E] is worth far more than a shame, and a rival's far more than a stranger's."
 qpq_offer_succession:0 "Succession"
 qpq_offer_succession_desc:0 "Name them your [designated_heir|E] on delivery."
 qpq_offer_clemency:0 "Clemency"
 qpq_offer_clemency_desc:0 "Release them or their kin from your [prison|E], and drop any charge you hold against them."
 qpq_offer_arms:0 "Arms"
 qpq_offer_arms_desc:0 "Lend them [levies|E] and [knights|E] until the deadline."
 qpq_offer_artifact:0 "Artifacts"
 qpq_offer_artifact_desc:0 "Hand over [artifacts|E], chosen by name. Each is worth its rarity and wear, and more to someone who needs what it gives: [prestige|E], [piety|E], [gold|E], strength in war, schemes, standing."
 qpq_offer_church:0 "Church favour"
 qpq_offer_church_desc:0 "An indulgence and absolution from the [head_of_faith|E]."
 qpq_offer_restraint:0 "Promise of Safety"
 qpq_offer_restraint_desc:0 "A promise, not a contract right: you will not [revoke|E] their titles or [imprison|E] them until the deadline. Doing so anyway is a breach."
 qpq_offer_hook:0 "Use Hook"
 qpq_offer_hook_desc:0 "Call in the [hook|E] you hold on them to press the deal."
 qpq_offer_charter:0 "Publish as a Charter"
 qpq_offer_charter_desc:0 "Proclaim the deal openly as a [qpq_charter|E]: nothing to expose. An honourable deal earns [prestige|E] for both; a scandalous one pays half its fallout at once. Conquest charters grant the Crown Mandate [casus_belli|E], and the target's [liege|E] and allies are warned."
 qpq_demand_gold:0 "Demand gold"
 qpq_demand_gold_desc:0 "They pay you the fair price in [gold|E], all up front unless you choose another timing."
 qpq_demand_on_delivery:0 "Accept payment on delivery"
 qpq_demand_on_delivery_desc:0 "You are paid once you have done your part."
 qpq_demand_split:0 "Half now, half on delivery"
 qpq_demand_split_desc:0 "The usual medieval arrangement."
 qpq_demand_stipend:0 "Yearly installments"
 qpq_demand_stipend_desc:0 "Paid across the term."
 qpq_demand_land:0 "Demand land"
 qpq_demand_land_desc:0 "One of their [counties|E], handed over when you deliver."
 qpq_demand_office:0 "Demand office"
 qpq_demand_office_desc:0 "A seat on their [council|E] now."
 qpq_demand_release_hook:0 "Demand they release a hook"
 qpq_demand_release_hook_desc:0 "They release the [hook|E] they hold on you."
 qpq_demand_my_word:0 "Demand a weak hook"
 qpq_demand_my_word_desc:0 "A [weak_hook|E] on them: a debt of honour."
 qpq_demand_clemency:0 "Demand clemency"
 qpq_demand_clemency_desc:0 "Release from [prison|E], and any charge against you dropped."
 qpq_demand_artifact:0 "Demand artifacts"
 qpq_demand_artifact_desc:0 "Their [artifacts|E], chosen by name, when you deliver. What they cost them is their rarity and wear."
 qpq_demand_church:0 "Demand church favour"
 qpq_demand_church_desc:0 "Indulgence and absolution, if they are a [head_of_faith|E]."
 qpq_offer_need_gold:0 "You need at least half the price in gold to hand"
 qpq_offer_one_timing:0 "Choose at most one payment timing"
 qpq_x_armed:0 "Armed league"
 qpq_x_armed_desc:0 "Swear to take up arms, not merely to protest. Tier IV towards your [liege|E]."
 qpq_x_consent:0 "Seek the liege's consent"
 qpq_x_consent_desc:0 "Tell your [liege|E] about the exchange. Tier I instead of III, and nothing for them to void later."
 qpq_x_armies:0 "Secretly promise armies"
 qpq_x_armies_desc:0 "Promise to march for their [claim|E]. They value it highly, and it is the clause that hurts if it comes out."
 qpq_actor_pact_cap_reached:0 "[actor.GetShortUIName|U] cannot keep track of another [qpq_deal|E] (2, plus 1 for every 5 [diplomacy_skill|E])"
 qpq_recipient_pact_cap_reached:0 "[recipient.GetShortUIName|U] cannot keep track of another [qpq_deal|E] (2, plus 1 for every 5 [diplomacy_skill|E])"
 qpq_valid_agent_same_faith:0 "[recipient.GetShortUIName|U] must share your faith"
 qpq_valid_can_marry:0 "[recipient.GetShortUIName|U] must be able to marry them"
 qpq_valid_not_excommunicated_agent:0 "The head of faith is in no position to sell favours"
