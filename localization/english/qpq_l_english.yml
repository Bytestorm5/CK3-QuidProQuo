 # ---------------- Game concepts, situation flavour, deal stakes ----------------
 qpq_hub.50.stakes_secret:0 "\n\nIf I agree, each of us will hold a secret about the other, and either of us could ruin us both."
 qpq_hub.50.stakes_charter:0 "\n\nThis one would be proclaimed openly, as a charter: nothing hidden, and so nothing to expose."
 qpq_sf_payer_secret:0 "#F You have bought a service no herald will ever proclaim. Until it is done, every glance from [Story.MakeScope.Var('qpq_agent').Char.GetFirstName] carries the weight of what you both know.#!"
 qpq_sf_agent_secret:0 "#F You have taken [Story.MakeScope.Var('qpq_payer').Char.GetFirstNamePossessive] bargain, and given your word in return. Whatever you do now, you do in both your names.#!"
 qpq_sf_payer_charter:0 "#F Your charter has been read aloud in the great hall. All the realm knows what you have asked of [Story.MakeScope.Var('qpq_agent').Char.GetFirstName], and what you have promised in return.#!"
 qpq_sf_agent_charter:0 "#F The charter bears your name for all to see. Whatever you win under it, you win with [Story.MakeScope.Var('qpq_payer').Char.GetFirstNamePossessive] blessing.#!"
 game_concept_qpq_scandal_tier:0 "Scandal Tier"
 game_concept_qpq_scandal_tiers:0 "Scandal Tiers"
 game_concept_qpq_scandal_tier_desc:0 "How damaging a [qpq_deal|E] would be if it came out, from 0 (honourable) to V (Damnable). Each side has its own tier.\n\nContext moves it: aiming a deed at a foreigner of a hostile [faith|E] lowers it; aiming it at a co-religionist ally, a fellow [vassal|E], [close_family|E], the clergy or your own [liege|E] raises it. Every secret deal is at least Tier I. Tier IV halves are [crimes|E]; Tier V halves are criminal and [shunned|E].\n\nWhen a secret deal comes out, whoever paid bears 60% of the fallout and whoever did the deed 40%, plus the full weight of any crime. The [qpq_wronged_party|E] bears a quarter; a stranger who exposes it bears nothing."
 game_concept_qpq_charter:0 "Charter"
 game_concept_qpq_charters:0 "Charters"
 game_concept_qpq_charter_desc:0 "A [qpq_deal|E] proclaimed openly instead of kept secret. Nothing is hidden, so nothing can be exposed, blackmailed over or inherited as a stain. An honourable charter earns both parties [prestige|E]; a scandalous one pays half its fallout the moment it is sealed, and the other side asks more for it. Conquest charters grant the Crown Mandate [casus_belli|E], and the target's [liege|E] and allies are warned."
 game_concept_qpq_wronged_party:0 "Wronged Party"
 game_concept_qpq_wronged_party_desc:0 "When one side of a [qpq_deal|E] breaks it, the other becomes the $game_concept_qpq_wronged_party$. They gain a [strong_hook|E] on the one who broke it, and exposing the deal costs them only a quarter of their usual share."
 qpq_deal.1.stakes_secret:0 "\n\nIf I agree, each of us will hold a secret about the other, and either of us could ruin us both. Should one of us break faith, the other is released."
 qpq_deal.1.stakes_charter:0 "\n\nThis one would be proclaimed openly, as a charter: nothing hidden, and so nothing to expose. Should one of us break faith, the other is released."
 game_concept_qpq_deal:0 "Deal"
 game_concept_qpq_deals:0 "Deals"
 game_concept_qpq_deal_desc:0 "A $game_concept_qpq_deal$ is a bargain struck in private: each side may do a deed for the other, give goods, or both, within a deadline of three to ten years. Each side has its own [qpq_scandal_tier|E], the worse of what it does and what it gives.\n\nA secret deal leaves each party holding a [secret|E] about the other, and is never below Tier I; exposing it exposes the whole deal. A deal may instead be proclaimed as a [qpq_charter|E].\n\nBreak your side and the other is released. A character can keep 2 deals at once, plus 1 for every 5 [diplomacy_skill|E]; running deals are tracked in the Situations window."

